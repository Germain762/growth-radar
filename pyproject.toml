[project]
name = "growth-radar"
version = "0.1.0"
description = "Modern data stack pipeline for detecting sector & thematic dynamics on equity markets"
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [
    { name = "Germain L" }
]

dependencies = [
    # --- Ingestion ---
    "yfinance>=0.2.40",
    "httpx>=0.27",
    "tenacity>=8.0",
    "pydantic>=2.7",
    # --- Storage ---
    "boto3>=1.34",
    "s3fs>=2024.6",
    "pyarrow>=15.0",
    # --- Transformation ---
    "duckdb>=1.0",
    # --- Utilities ---
    "python-dotenv>=1.0",
    "structlog>=24.1",
    "click>=8.1",
]

[project.optional-dependencies]
spark = [
    "pyspark==3.5.1",
]
orchestration = [
    "dagster>=1.7",
    "dagster-webserver>=1.7",
    "dagster-dbt>=0.23",
    "dagster-duckdb>=0.23",
]
dbt = [
    "dbt-core>=1.8",
    "dbt-duckdb>=1.8",
]
serving = [
    "streamlit>=1.35",
    "plotly>=5.20",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "ipykernel>=6.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort (imports ordering)
    "N",    # pep8-naming
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
