name: 'growth_radar'
version: '1.0.0'
config-version: 2

profile: 'growth_radar'

# Folders dbt looks at
model-paths: ["models"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# Default model materializations by folder
models:
  growth_radar:
    staging:
      +materialized: view
    intermediate:
      +materialized: ephemeral
    marts:
      +materialized: table
