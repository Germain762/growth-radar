version: 2

models:
  - name: stg_yahoo_prices
    description: |
      Cleaned and unified daily OHLCV prices from yfinance bronze.
      Unions historical (per-ticker) and daily (per-day) sources,
      deduplicated on (ticker_nk, price_date).

    columns:
      - name: ticker_nk
        description: "Ticker symbol — natural key part."
        tests:
          - not_null

      - name: price_date
        description: "Trading date."
        tests:
          - not_null

      - name: open_price
        description: "Opening price for the day."
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
              # No max_value : Berkshire Hathaway A class is at $700k+

      - name: high_price
        description: "Highest price during the day."
        tests:
          - not_null

      - name: low_price
        description: "Lowest price during the day."
        tests:
          - not_null

      - name: close_price
        description: "Closing price (unadjusted)."
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0

      - name: volume
        description: "Trading volume (number of shares traded)."
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0

    # Composite primary key : (ticker, date) must be unique
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - ticker_nk
            - price_date
  - name: stg_yahoo_ticker_info
    description: |
      Latest snapshot of static metadata per ticker.
      Sourced from the weekly yahoo_ticker_info_bronze asset.

    columns:
      - name: ticker_nk
        description: "Ticker symbol — natural key."
        tests:
          - not_null
          - unique     # one row per ticker after deduplication

      - name: instrument_type
        description: "Type of instrument."
        tests:
          - not_null
          - accepted_values:
              values: ['equity', 'etf', 'index', 'unknown']

      - name: source_fetched_at
        description: "When yfinance was queried for this snapshot."
        tests:
          - not_null
